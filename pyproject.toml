[project]
name = "voxprompt"
version = "0.1.0"
description = "Hold a key, speak, and get a clean prompt at your cursor."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlx-qwen3-asr>=0.4.4",
    "numpy",
    "openai>=3.46",
    "pyobjc-framework-ApplicationServices",
    "pyobjc-framework-Cocoa",
    "pyobjc-framework-Quartz",
    "python-dotenv",
    "rumps>=0.4",
    "sounddevice>=0.5",
]

[project.optional-dependencies]
dev = ["pytest"]
bench = ["mlx-whisper>=0.4.3"]

[project.scripts]
voxprompt = "voxprompt.cli:main"
voxprompt-app = "voxprompt.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxprompt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["evals"]
