      <rect x="67.5" y="7" width="5" height="26" rx="2.5" fill="#FFB020"/>
    </g>

    <text x="536" y="62" font-size="14" font-weight="600" letter-spacing="1.5" fill="#FFB020">YOUR CURSOR GETS</text>
