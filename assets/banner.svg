      <text x="48" y="112">can you rename this to</text>
      <text x="48" y="150"><tspan text-decoration="line-through">user id, no wait,</tspan> <tspan fill="#F4F1EA">account id,</tspan></text>
      <text x="48" y="188">and <tspan text-decoration="line-through">uh</tspan> update the callers too</text>
    </g>

    <g transform="translate(396 120)">
      <rect width="92" height="40" rx="20" fill="#14151F" stroke="#3A3C55"/>
      <g fill="#F4F1EA">
        <rect x="19.5" y="11" width="5" height="18" rx="2.5"/>
        <rect x="31.5" y="7" width="5" height="26" rx="2.5"/>
        <rect x="43.5" y="10" width="5" height="20" rx="2.5"/>
        <rect x="55.5" y="14" width="5" height="12" rx="2.5"/>
