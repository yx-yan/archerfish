      <stop offset="0" stop-color="#2B2D42"/>
      <stop offset="1" stop-color="#14151F"/>
    </linearGradient>
  </defs>
  <rect width="880" height="280" rx="24" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
